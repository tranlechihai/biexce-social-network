name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.lock
      - run: ruff check ting_ting tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install -r requirements.lock
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - run: pytest -q

  # PostgreSQL cutover gate: the full migration chain 0001->head on real
  # PostgreSQL, the 0011 parity fixes, the one-shot SQLite->PG data copy
  # (counts + max(id) + sequence re-anchoring) and an API smoke, all from
  # tests/integration/test_pg_cutover.py. Plus: the deploy image builds and
  # the compose file validates.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: biexce_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci -d biexce_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TING_JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install -r requirements.lock
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: PostgreSQL cutover gate
        run: |
          export TING_DATABASE_URL="postgresql+psycopg://ci:ci@localhost:5432/biexce_test"
          export TING_PG_TEST_URL="$TING_DATABASE_URL"
          pytest -q tests/integration/test_pg_cutover.py
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-placeholder
        run: docker compose config --quiet
      - name: Build deploy image
        run: docker build -t biexce-social:ci .
      - name: Verify image hygiene (package data present, no secrets/DBs leaked)
        run: |
          docker run --rm --entrypoint python biexce-social:ci -c "
          import pathlib
          package_dir = pathlib.Path(__import__('ting_ting').__file__).parent
          assert (package_dir / 'web' / 'templates').is_dir(), 'templates missing from package'
          assert (package_dir / 'static').is_dir(), 'static missing from package'
          root = pathlib.Path('/app')
          assert not (root / '.env').exists(), '.env leaked into the image'
          assert not list(root.glob('*.db*')), 'database files leaked into the image'
          assert not (root / 'backups').exists(), 'backups leaked into the image'
          assert not list(root.glob('*.egg-info')), 'egg-info leaked into the image'
          print('image hygiene OK')
          "

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.lock
      - name: Audit prod lockfile
        # --disable-pip --no-deps: audit the pins exactly as locked (no re-resolve).
        # Waived: PYSEC-2026-1325 (CVE-2024-23342, python-ecdsa Minerva timing
        # attack, no upstream fix; unreachable - app uses HS256 JWT only).
        run: pip-audit -r requirements.lock --disable-pip --no-deps --ignore-vuln PYSEC-2026-1325
      - name: Audit dev lockfile
        # Waived: PYSEC-2026-1845 (CVE-2025-71176, pytest tmpdir handling, local
        # attack vector, dev/CI-only tool; fix requires pytest 9.x which violates
        # the pinned constraint >=7.4,<9.0 - upgrade tracked separately).
        run: pip-audit -r requirements-dev.lock --disable-pip --no-deps --ignore-vuln PYSEC-2026-1845
