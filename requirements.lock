# T-012 (2026-08-19): runtime (prod) dependencies only, resolved clean via
# `pip install .` in a fresh venv (Python 3.14.4, pip 26.2.1). Pins are
# version-only (no path/editable entries) and install on CPython 3.10-3.14.
#
# Includes: pyproject [project].dependencies and their transitive deps
# (uvicorn[standard] -> PyYAML/httptools/uvloop/websockets/watchfiles;
#  pydantic-settings -> python-dotenv).
# Excludes: the app package itself and all dev/test tools.
#
# Deploy:
#   python -m venv .venv
#   .venv/bin/pip install -r requirements.lock
#   .venv/bin/pip install --no-deps -e .     # or install a built wheel
