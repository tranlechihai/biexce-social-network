{% extends "base.html" %}
{% block title %}Đăng nhập — Biexce{% endblock %}
{% block content %}
<h1>Đăng nhập</h1>
<form class="form" action="/web/login" method="post">
    <div class="form-group">
        <label for="identifier">Tên người dùng hoặc email</label>
        <input type="text" id="identifier" name="identifier" required
               placeholder="username hoặc email"
               value="{{ (old or {}).get('identifier', '') }}">
    </div>
    <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required
               placeholder="Mật khẩu của bạn">
    </div>
    {% if errors %}
    <div class="alert alert-error" role="alert">
        <ul>
        {% for err in errors %}
            <li>{{ err }}</li>
        {% endfor %}
        </ul>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary">Đăng nhập</button>
</form>
<p class="mt">Chưa có tài khoản? <a href="/web/register">Đăng ký ngay</a></p>
{% endblock %}
