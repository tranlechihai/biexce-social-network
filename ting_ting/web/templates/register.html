{% extends "base.html" %}
{% block title %}Đăng ký — Biexce{% endblock %}
{% block content %}
<h1>Tạo tài khoản</h1>
<form class="form" action="/web/register" method="post">
    <div class="form-group">
        <label for="username">Tên người dùng</label>
        <input type="text" id="username" name="username" required
               minlength="3" maxlength="30" pattern="[a-z0-9_]+"
               placeholder="Chữ thường, số và dấu gạch dưới"
               value="{{ (old or {}).get('username', '') }}">
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required
               placeholder="you@example.com"
               value="{{ (old or {}).get('email', '') }}">
    </div>
    <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required minlength="8"
               placeholder="Tối thiểu 8 ký tự">
    </div>
    {% if errors %}
    <div class="alert alert-error" role="alert">
        <ul>
        {% for err in errors %}
            <li>{{ err }}</li>
        {% endfor %}
        </ul>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary">Đăng ký</button>
</form>
<p class="mt">Đã có tài khoản? <a href="/web/login">Đăng nhập</a></p>
{% endblock %}
