[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ting-ting"
version = "0.1.0"
description = "Ting Ting Social Backend MVP"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "bcrypt>=4.0,<6.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.6,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9.0",
    "httpx>=0.27,<1.0",
    "pytest-asyncio>=0.23,<1.0",
    "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
include = ["ting_ting*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
